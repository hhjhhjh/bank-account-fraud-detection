[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bank-account-fraud-detection"
version = "0.1.0"
description = "Reproducible time-based BAF Base research"
requires-python = ">=3.11,<3.15"
dependencies = [
  "numpy>=1.26,<3", "pandas>=2.2,<3", "scikit-learn>=1.5,<2",
  "matplotlib>=3.8,<4", "joblib>=1.4,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
torch = ["torch>=2.5,<3"]

[project.scripts]
baf-data = "baf.cli:main"
baf-env = "baf.runtime:main"
baf-train = "baf.train:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
