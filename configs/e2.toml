[data]
processed_dir = "data/processed/full"

[model]
hidden_dims = [128, 64]
dropout = 0.1

[runtime]
device = "auto"

[training]
loss = "focal"
focal_gamma = 2.0
seed = 42
epochs = 20
learning_rate = 0.001
weight_decay = 0.0001
patience = 5
mixed_precision = "off"
checkpoint_dir = "checkpoints/e2"
# Set batch_size here or pass --batch-size after choosing a device.

[smoke]
train_rows = 20000
validation_rows = 10000
