processed_dir = "data/processed/full"
checkpoint_dir = "checkpoints"
output_dir = "results/learning-rate-search"
baseline_output_dir = "results/reference/fixed-lr-comparison"
environment_file = "results/environment/school-20261126.json"
device = "cuda"
batch_size = 256
epochs = 20
selection_seed = 42
seeds = [42, 43, 44]

[models.b0]
config = "configs/b0.toml"
baseline = "b0/school-b0-seed{seed}"
learning_rates = [0.0003, 0.001, 0.003]

[models.e1]
config = "configs/e1.toml"
baseline = "e1/school-e1-seed{seed}"
learning_rates = [0.0003, 0.001, 0.003]

[models.e2]
config = "configs/e2.toml"
baseline = "e2/school-e2-gamma0.5-seed{seed}"
learning_rates = [0.0003, 0.001, 0.003]
focal_gamma = 0.5

[models.e3]
config = "configs/e3.toml"
baseline = "e3/school-e3-seed{seed}"
learning_rates = [0.0003, 0.001, 0.003]

[models.e4]
config = "configs/e4.toml"
baseline = "e4/school-e4-ratio0.1-lr0.001-seed{seed}"
learning_rates = [0.0003, 0.001, 0.003]
oversampling_ratio = 0.1

[models.e5]
config = "configs/e5.toml"
baseline = "e5/school-e5-lr0.001-seed{seed}"
learning_rates = [0.0001, 0.0003, 0.001]
